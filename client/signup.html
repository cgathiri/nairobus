<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>NairoBus | Sign Up</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class = "auth-page">

<div class="signup-container">
    <img src="assets/nairobus logo.png" alt="NairoBus Logo" class="logo">

    <h1>NairoBus</h1>

    <h2 class="form-title">Create Account</h2>

    <form>
        <div class="name-row">
            <div class="input-group">
                <input type="text" id="firstName" name="firstName" placeholder="First Name" required>
            </div>

            <div class="input-group">
                <input type="text" id="lastName" name="lastName" placeholder="Last Name" required>
            </div>
        </div>

        <div class="input-group">
            <input type="email" id="email" name="email" placeholder="Email Address" required>
        </div>
        <p id="emailMessage" class="form-message"></p>

        <div class="password-row">
            <div class="input-group password-wrapper">
                <input type="password" id="password" name="password" placeholder="Password" required>
                <span class="toggle-password" data-target="password">Show</span>
            </div>

            <div class="input-group password-wrapper">
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
                <span class="toggle-password" data-target="confirmPassword">Show</span>
            </div>
        </div>

        <p id="passwordMessage" class="form-message"></p>

        <p id="signupMessage" class="form-message"></p>

        <button type="submit">Create Account</button>
    </form>

    <p class="signup-text">
        Already have an account?
        <a href="index.html">Log In</a>
    </p>
</div>

<script src="js/signup.js"></script>

</body>
</html>
