    <title>NairoBus | Home</title>
    
    <!-- poppins font -->

<body>

<nav class="navbar">
    <div class="nav-left">
        <a href="home.html" class="brand">
            <img src="assets/nairobus logo.png" class="logo-small" alt="NairoBus Logo">
            <span class="brand-name">NairoBus Home</span>

    </div>
    
    <div class="nav-right">
        <!-- <div class = "dropdown">
